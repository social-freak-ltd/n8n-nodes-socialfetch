# Publishes this package to npm when you push a version tag (e.g. 0.1.0).
# Uses npm provenance (required for n8n community verification from May 2026).
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret is used or needed.
#
# One-time setup: npmjs.com → package n8n-nodes-socialfetch → Trusted Publishers
#   - Provider: GitHub Actions
#   - Repository: social-freak-ltd/n8n-nodes-socialfetch
#   - Workflow filename: publish.yml
#
# Release: update version in package.json, commit, then:
#   git tag 0.1.0
#   git push origin main --tags
#
# Tag must match package.json version (no "v" prefix with the filter below).

name: Publish

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 24 ships npm 11.
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Token-free: npm signs in with this job's GitHub OIDC token (id-token: write above).
      # Never set an auth token here: a stale one overrides OIDC and npm answers 404.
      - name: Release to npm with provenance
        run: pnpm run release
